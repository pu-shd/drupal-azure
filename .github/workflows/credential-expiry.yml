name: Credential Expiry Reminder

# Credentials that expire on a date, rather than by an event someone would
# notice, fail without warning: the Entra gate's client secret lasts a year, and
# when it lapses nobody can sign in. This checks the expiry that
# scripts/setup-site-gate.sh --set-repo-vars records in the repository variable
# SITE_AUTH_SECRET_EXPIRES and keeps one tracking issue for it: opened 30 days
# ahead, refreshed daily, closed once a rotation records a later date. An
# expired secret turns the run red.
#
# Skipped while the variable is unset (no gate). The Deploy workflow warns when
# the gate is on and the variable is missing.
#
# No Azure login: reading credential dates from Entra would need a Microsoft
# Graph permission with admin consent.

on:
  schedule:
    # Daily at 07:00 UTC, after the 06:00 security audit.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Show what would happen to the issue; change nothing.'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check credential expiry
    runs-on: ubuntu-latest
    if: vars.SITE_AUTH_SECRET_EXPIRES != ''
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Entra gate client secret
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPIRES: ${{ vars.SITE_AUTH_SECRET_EXPIRES }}
          DRY_RUN: ${{ inputs.dry_run && 'yes' || 'no' }}
        run: |
          args=(--name "Entra gate client secret" --expires "$EXPIRES" \
                --rotate "./scripts/setup-site-gate.sh --rotate --set-repo-vars")
          [ "$DRY_RUN" = "yes" ] && args+=(--dry-run)
          ./scripts/check-credential-expiry.sh "${args[@]}"
